<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ok Küp</title>
  <meta name="description" content="Küpün üzerindeki okları temizle, kafesteki tatlı karakteri kurtar!">
  <meta name="theme-color" content="#0f1b24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ok Küp">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- Ana menü -->
    <section id="screen-home" class="screen active">
      <div id="home-stage" aria-hidden="true"></div>
      <div class="home-top">
        <h1>Ok Küp</h1>
        <p class="tagline">Okları doğru sırayla çek, sıkışan dostunu kurtar.</p>
      </div>
      <div class="menu">
        <dl class="stats-row">
            <div class="stat"><dt>Bölüm</dt><dd id="home-level">1</dd></div>
            <div class="stat"><dt>Yıldız</dt><dd id="home-stars">0</dd></div>
            <div class="stat"><dt>Puan</dt><dd id="home-score">0</dd></div>
          </dl>
        <button class="btn big primary" id="btn-play">Oyna <span class="btn-sub" id="play-sub">Bölüm 1</span></button>
        <button class="btn big vs" id="btn-friends">Arkadaşlar &amp; VS</button>
        <button class="btn small ghost" id="btn-howto">Nasıl oynanır?</button>
      </div>
      <div class="conn" id="conn-status"><span class="dot"></span><span class="txt">Bağlanıyor…</span></div>
    </section>

    <!-- Bölüm seçimi -->

    <!-- Arkadaşlar -->
    <section id="screen-friends" class="screen">
      <header class="bar">
        <button class="icon-btn" data-back>‹</button>
        <h2>Arkadaşlar &amp; VS</h2>
        <span></span>
      </header>
      <div class="scroll">
        <div class="card me-card">
          <label class="lbl">Adın</label>
          <div class="row">
            <input id="my-name" maxlength="20" placeholder="Adını yaz" autocomplete="off">
            <button class="btn small" id="btn-save-name">Kaydet</button>
          </div>
          <label class="lbl">Arkadaş kodun</label>
          <div class="row">
            <div class="code" id="my-code">——————</div>
            <button class="btn small" id="btn-share-code">Paylaş</button>
          </div>
          <div class="muted" id="my-record"></div>
        </div>
        <div class="card">
          <label class="lbl">Arkadaş ekle</label>
          <div class="row">
            <input id="friend-code" maxlength="6" placeholder="KOD" autocapitalize="characters" autocomplete="off">
            <button class="btn small primary" id="btn-add-friend">Ekle</button>
          </div>
        </div>
        <h3 class="section-title">Arkadaşların</h3>
        <div id="friend-list" class="friend-list"></div>
        <p class="muted center" id="friends-offline-note" hidden>VS için sunucuya bağlı olmalısın.</p>
      </div>
    </section>

    <!-- Oyun -->
    <section id="screen-game" class="screen">
      <div id="stage"></div>
      <div class="hud top">
        <button class="icon-btn" id="btn-quit">✕</button>
        <div class="hud-center">
          <div class="hud-level" id="hud-level">Bölüm 1</div>
          <div class="hud-timer" id="hud-timer">0:00.0</div>
        </div>
        <div class="hud-arrows"><span id="hud-remaining">0</span><small id="hud-unit">ok</small></div>
      </div>
      <div class="vs-bar" id="vs-bar" hidden>
        <div class="vs-row"><span class="vs-name">Sen</span><div class="progress"><div id="vs-me" class="fill me"></div></div></div>
        <div class="vs-row"><span class="vs-name" id="vs-opp-name">Rakip</span><div class="progress"><div id="vs-opp" class="fill opp"></div></div></div>
      </div>
      <div class="hud bottom">
        <button class="icon-btn" id="btn-reset-view" aria-label="Görünümü sıfırla">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6" /><path d="M4 4v4h4" /></svg>
        </button>
        <button class="icon-btn" id="btn-hint" aria-label="İpucu">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z" /></svg>
        </button>
      </div>
      <div class="result-strip" id="result-strip" hidden></div>
      <button class="btn primary next-btn" id="btn-next" hidden>Sonraki bölüm <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" /></svg></button>
      <div class="stun" id="stun" hidden>Çarptı</div>
      <div class="tutorial" id="tutorial" hidden><div class="ring"></div><div class="tip">Oka dokun</div></div>
      <div class="countdown" id="countdown" hidden></div>
    </section>
  </div>

  <!-- Modallar -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
