<style>/* Ok Küp — açık, ferah ve kurumsal oyun arayüzü.
   Palet: buz mavisi-gri zemin, beyaz cam kartlar, derin lacivert yazı, camgöbeği ana renk, kehribar vurgu.
   Yerleşim: üst çubuk + ortada 3D sahne + altta tek bir eylem kartı. */
:root {
  --bg-top: #f1f6f9;
  --bg-bottom: #d4e2ea;
  --ink: #12263a;
  --ink-2: #2b4258;
  --muted: #627789;
  --panel: rgba(255, 255, 255, 0.74);
  --panel-solid: #ffffff;
  --panel-2: rgba(18, 38, 58, 0.05);
  --stroke: rgba(18, 38, 58, 0.09);
  --stroke-2: rgba(18, 38, 58, 0.16);
  --primary: #0e9f8a;
  --primary-2: #2cc5a8;
  --primary-deep: #0a7466;
  --on-primary: #ffffff;
  --amber: #f5a524;
  --amber-2: #ffc657;
  --amber-deep: #c47c09;
  --coral: #ff6b57;
  --sky: #4e9fe0;
  --shadow: 0 18px 40px rgba(18, 38, 58, 0.14);
  --shadow-sm: 0 6px 16px rgba(18, 38, 58, 0.10);
  --font-display: "Avenir Next", "Avenir", "SF Pro Rounded", "SF Pro Display", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --glass-blur: blur(18px) saturate(160%);
  color-scheme: light;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  font-family: var(--font-body); color: var(--ink);
  background:
    radial-gradient(70% 45% at 100% 100%, rgba(14, 159, 138, 0.16), transparent 70%),
    radial-gradient(60% 40% at 0% 0%, rgba(245, 165, 36, 0.12), transparent 70%),
    linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
body::before { /* çok silik nokta deseni: küpün yüzeyini andırır */
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(18, 38, 58, 0.07) 1px, transparent 1.5px);
  background-size: 22px 22px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); mask-image: linear-gradient(180deg, #000 0%, transparent 60%);
}
input, select { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
svg { flex: none; }

#app { position: fixed; inset: 0; }
.screen {
  position: absolute; inset: 0; display: none; flex-direction: column;
  padding: calc(var(--safe-top) + 12px) max(16px, var(--safe-right)) calc(var(--safe-bottom) + 16px) max(16px, var(--safe-left));
}
.screen.active { display: flex; }
.vignette { display: none; }

/* ---- Ortak ---- */
.round-btn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer;
  border: 1px solid var(--stroke); background: var(--panel); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-sm); color: var(--ink); transition: transform .12s;
}
.round-btn:active { transform: scale(0.92); }
.round-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.round-btn.muted { color: var(--muted); }
.round-btn.muted .wave { opacity: 0; }
.glass { background: var(--panel); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--stroke); }

/* ---- Ana ekran ---- */
#home-stage { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
#home-stage canvas { width: 100%; height: 100%; display: block; }
#screen-home > *:not(#home-stage):not(.vignette) { position: relative; z-index: 1; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.level-badge {
  position: relative; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px;
  font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
  background: linear-gradient(160deg, var(--primary-2), var(--primary) 55%, var(--primary-deep));
  color: var(--on-primary); box-shadow: 0 4px 0 var(--primary-deep), 0 10px 22px rgba(14, 159, 138, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  transform: rotate(-6deg);
}
.level-badge span { transform: rotate(6deg); }
.badge-ring { display: none; }
.chips { display: flex; align-items: center; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 9px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--stroke); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  font-family: var(--font-display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow-sm);
}
.chip svg { width: 19px; height: 19px; }
.i-star { fill: var(--amber); }
.i-gem { fill: rgba(14, 159, 138, 0.18); stroke: var(--primary); stroke-width: 1.5; stroke-linejoin: round; }
.chips .round-btn { width: 36px; height: 36px; }
.chips .round-btn svg { width: 18px; height: 18px; }

.brand { margin-top: 3.2vh; text-align: center; }
.wordmark {
  margin: 0; display: flex; justify-content: center; align-items: baseline; gap: 0.22em;
  font-family: var(--font-display); font-weight: 900; font-size: clamp(46px, 14vw, 62px); letter-spacing: -0.01em; line-height: 1;
  color: var(--ink);
}
.wordmark span { text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9), 0 12px 24px rgba(18, 38, 58, 0.18); }
.wordmark span + span { color: var(--primary); }
.tagline { margin: 10px auto 0; color: var(--muted); font-size: 15px; max-width: 30ch; line-height: 1.45; }

.next-card {
  margin-top: auto; width: 100%; max-width: 440px; align-self: center;
  padding: 16px; border-radius: 26px; background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.7);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 12px;
}
.next-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.next-title { margin: 4px 0 2px; font-family: var(--font-display); font-size: 22px; font-weight: 800; text-wrap: balance; color: var(--ink); }
.next-name { color: var(--primary); }
.next-meta { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.difficulty { text-align: right; flex: none; }
.pips { display: flex; gap: 4px; margin-top: 8px; justify-content: flex-end; }
.pips i { width: 9px; height: 18px; border-radius: 3px; background: rgba(18, 38, 58, 0.1); transform: skewX(-12deg); }
